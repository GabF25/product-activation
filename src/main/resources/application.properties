spring.application.name=product-activation
server.port=${SERVER_PORT:28080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product-activation}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:pass}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:product-activation}

springdoc.override-with-generic-response=false

logging.pattern.correlation=[%X{correlationId:-}]
