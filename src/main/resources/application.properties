spring.application.name=product-activation
server.port=${SERVER_PORT:28080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product-activation}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:pass}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:product-activation}

provider.base-url=${PROVIDER_BASE_URL:http://localhost:8089}
provider.connect-timeout=${PROVIDER_CONNECT_TIMEOUT:2s}
provider.read-timeout=${PROVIDER_READ_TIMEOUT:5s}

api.limits.max-body-size=1KB
api.limits.requests-per-minute=${RATE_LIMIT_PER_MINUTE:120}

activation.processing.enabled=${PROCESSING_ENABLED:true}
activation.processing.poll-interval=PT2S
activation.processing.recovery-interval=PT1M
activation.processing.batch-size=20
activation.processing.max-attempts=5
activation.processing.initial-backoff=5s
activation.processing.max-backoff=5m
activation.processing.stuck-timeout=5m

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=15s

springdoc.override-with-generic-response=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

logging.structured.format.console=${LOG_FORMAT:ecs}
logging.pattern.correlation=[%X{correlationId:-}]
